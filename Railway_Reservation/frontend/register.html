<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Railway Ticket Reservation</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="/index.html" class="nav-brand">
                <span class="nav-brand-icon">🚆</span>
                <span>RailReserve Portal</span>
            </a>
            <div class="nav-links" id="navbar-auth-links"></div>
        </div>
    </nav>

    <main class="main-content">
        <div class="auth-wrapper" style="max-width: 540px;">
            <div class="auth-card">
                <div class="auth-header">
                    <h2>Passenger Registration</h2>
                    <p>Create your personal profile for booking and cancellations</p>
                </div>

                <div id="alert-box"></div>

                <form id="register-form" onsubmit="handleRegister(event)">
                    <div class="form-group" style="margin-bottom: 1rem;">
                        <label for="full_name">Full Legal Name</label>
                        <input type="text" id="full_name" class="form-control" placeholder="e.g., Rajesh Sharma" required>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
                        </div>
                        <div class="form-group">
                            <label for="phone">10-Digit Mobile Number</label>
                            <input type="tel" id="phone" class="form-control" placeholder="9876543210" maxlength="10" required>
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
                        <div class="form-group">
                            <label for="gender">Gender</label>
                            <select id="gender" class="form-control" required>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="age">Age (Years)</label>
                            <input type="number" id="age" class="form-control" min="5" max="120" value="28" required>
                        </div>
                    </div>

                    <div class="form-group" style="margin-bottom: 1.5rem;">
                        <label for="password">Create Password (min 6 characters)</label>
                        <input type="password" id="password" class="form-control" placeholder="••••••••" minlength="6" required>
                    </div>

                    <button type="submit" id="reg-btn" class="btn btn-accent btn-block">
                        Register Account
                    </button>
                </form>

                <div class="auth-footer">
                    <p>Already have an account? <a id="login-link" href="/login.html">Sign In here</a></p>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>© 2026 Railway Ticket Reservation System</p>
    </footer>

    <script src="/js/validation.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const redirectParam = urlParams.get('redirect');

        if (redirectParam) {
            document.getElementById('login-link').href = `/login.html?redirect=${encodeURIComponent(redirectParam)}`;
        }

        async function handleRegister(e) {
            e.preventDefault();
            clearAlert();

            const full_name = document.getElementById('full_name').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const gender = document.getElementById('gender').value;
            const age = document.getElementById('age').value;
            const password = document.getElementById('password').value;

            if (!Validator.isValidEmail(email)) {
                showAlert("Please enter a valid email address.");
                return;
            }

            if (!Validator.isValidPhone(phone)) {
                showAlert("Phone number must be exactly 10 digits.");
                return;
            }

            const btn = document.getElementById('reg-btn');
            btn.disabled = true;
            btn.innerText = "Creating account...";

            const res = await API.post('/api/register', {
                full_name, email, phone, gender, age, password
            });

            btn.disabled = false;
            btn.innerText = "Register Account";

            if (res.success) {
                // Auto login immediately
                const loginRes = await API.post('/api/login', {
                    identifier: email,
                    password: password
                });

                if (loginRes.success) {
                    Session.setUser(loginRes.user, loginRes.session_token);
                    showAlert("Registration successful! Logging you in...", "success");
                    setTimeout(() => {
                        window.location.href = redirectParam || '/user_dashboard.html';
                    }, 800);
                } else {
                    showAlert("Registration successful! Redirecting to login...", "success");
                    setTimeout(() => {
                        const target = redirectParam ? `/login.html?redirect=${encodeURIComponent(redirectParam)}` : '/login.html';
                        window.location.href = target;
                    }, 1200);
                }
            } else {
                showAlert(res.error || "Registration failed.");
            }
        }
    </script>
</body>
</html>
